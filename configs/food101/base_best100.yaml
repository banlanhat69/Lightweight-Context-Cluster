protocol:
  purpose: food101_best_effort_two_stage_200_epoch_architecture_comparison
  dataset: food101
  session: two_stage_200
  pretrained: false
  model_specific_training_recipe: true
  canonical: true

data:
  name: food101
  root: data/food101
  download: true
  image_size: 224
  eval_crop_pct: 0.90
  val_fraction: 0.10
  split_seed: 42
  batch_size: 32
  val_batch_size: 64
  test_batch_size: 64
  workers: 2
  # Recreating workers every epoch lets checkpoint resume reproduce worker RNG seeding.
  persistent_workers: false
  pin_memory: true
  drop_last: true
  loader_seed: 42

train:
  seed: 42
  deterministic: false
  epochs: 200
  warmup_epochs: 5
  amp: true
  kd_method: none
  kd_alpha: 0.0
  skip_test: false
