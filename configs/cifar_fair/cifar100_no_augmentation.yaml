protocol:
  name: cifar100_ce_noaug_hbcc_stage4_ablation_v6
  purpose: architecture_comparison_ce_only
  dataset: cifar100
  session: baseline
  augmentation: none
  canonical: true
  effective_epochs: 300
  ce_epochs: 300

data:
  name: cifar100
  root: data
  download: true
  batch_size: 128
  val_batch_size: 256
  test_batch_size: 256
  val_size: 5000
  split_seed: 42
  workers: 4
  pin_memory: true
  drop_last: true

train:
  seed: 42
  deterministic: true
  epochs: 300
  warmup_epochs: 5
  lr: 0.001
  weight_decay: 0.05
  label_smoothing: 0.10
  amp: true
  skip_test: false
